name: Draft release sync

# This adapter is intentionally operator-dispatched and environment-gated. The
# renderer is offline and deterministic; this workflow only supplies verified
# release evidence and opens or updates one draft PR. It never publishes a
# bottle, marks a PR ready, labels it for merge, or merges it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part UNITARES version (for example 3.6.0)
        required: true
      tag:
        description: Immutable upstream tag (must be vVERSION)
        required: true
      commit:
        description: Full lowercase commit named by the tag
        required: true
      archive_sha256:
        description: SHA-256 of the release-owned unitares-VERSION.tar.gz asset
        required: true

permissions:
  contents: read

concurrency:
  group: homebrew-release-sync
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.repository == 'cirwel/homebrew-unitares' &&
      github.ref == 'refs/heads/main' &&
      vars.UNITARES_HOMEBREW_RELEASE_SYNC_ENABLED == 'true'
    environment: homebrew-release-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the declared upstream commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cirwel/unitares
          ref: ${{ inputs.commit }}
          path: _upstream
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the tag and immutable release asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$VERSION"
          test "$(git -C _upstream rev-parse HEAD)" = "$COMMIT"
          git -C _upstream fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git -C _upstream rev-list -n 1 "$TAG")" = "$COMMIT"
          archive="$RUNNER_TEMP/unitares-$VERSION.tar.gz"
          gh release download "$TAG" --repo cirwel/unitares \
            --pattern "unitares-$VERSION.tar.gz" --output "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$ARCHIVE_SHA256"
          mkdir "$RUNNER_TEMP/release"
          tar -tzf "$archive" > "$RUNNER_TEMP/archive-files.txt"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/archive-files.txt"; then
            echo "release archive contains an unsafe path" >&2
            exit 1
          fi
          tar -xzf "$archive" -C "$RUNNER_TEMP/release"
          test "$(find "$RUNNER_TEMP/release" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          release_root="$(find "$RUNNER_TEMP/release" -mindepth 1 -maxdepth 1 -type d)"
          echo "UNITARES_RELEASE_ROOT=$release_root" >> "$GITHUB_ENV"
          echo "UNITARES_ARCHIVE_URL=https://github.com/cirwel/unitares/releases/download/$TAG/unitares-$VERSION.tar.gz" >> "$GITHUB_ENV"

      - name: Render and verify the tap transition
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail
          branch=auto/homebrew-release-sync
          remote_ref="refs/remotes/origin/$branch"
          lease="--force-with-lease=refs/heads/$branch:"
          if git show-ref --verify --quiet "$remote_ref"; then
            expected_remote="$(git rev-parse "$remote_ref")"
            authors="$(git log --format='%ae' "origin/main..$remote_ref")"
            while IFS= read -r author; do
              if [ -n "$author" ] && \
                  [ "$author" != '342195540+unitares-agents[bot]@users.noreply.github.com' ]; then
                echo "automation branch contains a non-bot commit; refusing to overwrite it" >&2
                exit 1
              fi
            done <<< "$authors"
            git checkout -B "$branch" "$remote_ref"
            git reset --hard origin/main
            lease="--force-with-lease=refs/heads/$branch:$expected_remote"
          else
            git checkout -B "$branch" origin/main
          fi
          echo "UNITARES_RELEASE_LEASE=$lease" >> "$GITHUB_ENV"
          floor_pr="$(jq -r .release_floor_pr SOURCES.json)"
          floor_commit="$(gh pr view "$floor_pr" --repo cirwel/unitares \
            --json state,mergeCommit \
            --jq 'select(.state == "MERGED") | .mergeCommit.oid')"
          test -n "$floor_commit"
          python3 scripts/release_sync.py \
            --source-root "$UNITARES_RELEASE_ROOT" \
            --release-repo "$GITHUB_WORKSPACE/_upstream" \
            --version "$VERSION" --tag "$TAG" --commit "$COMMIT" \
            --archive-url "$UNITARES_ARCHIVE_URL" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --release-floor-commit "$floor_commit"
          python3 scripts/release_sync.py \
            --source-root "$UNITARES_RELEASE_ROOT" \
            --release-repo "$GITHUB_WORKSPACE/_upstream" \
            --version "$VERSION" --tag "$TAG" --commit "$COMMIT" \
            --archive-url "$UNITARES_ARCHIVE_URL" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --release-floor-commit "$floor_commit" --check
          python3 scripts/test_release_sync.py
          for path in $(jq -r '.files | keys[]' SOURCES.json); do
            cmp "$UNITARES_RELEASE_ROOT/$path" "_upstream/$path"
          done

      - name: Mint a tap-scoped App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          client-id: ${{ vars.UNITARES_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.UNITARES_AGENT_APP_PRIVATE_KEY }}
          owner: cirwel
          repositories: homebrew-unitares
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the draft release PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          set -euo pipefail
          branch=auto/homebrew-release-sync
          git config user.name "unitares-agents[bot]"
          git config user.email "342195540+unitares-agents[bot]@users.noreply.github.com"
          git add Formula/unitares.rb SOURCES.json
          if git diff --cached --quiet; then
            echo "Tap already matches $TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore(release): sync UNITARES $TAG"
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/cirwel/homebrew-unitares.git"
          git push "$UNITARES_RELEASE_LEASE" --force-if-includes origin \
            "HEAD:refs/heads/$branch"
          body="$RUNNER_TEMP/pr-body.md"
          cat > "$body" <<EOF
          This draft updates the tap to UNITARES $TAG at $COMMIT.

          Evidence:
          - immutable release asset: $UNITARES_ARCHIVE_URL
          - SHA-256: $ARCHIVE_SHA256
          - the renderer verifies the release contains the native updater and all tracked sources before it may remove any remaining v3.5.0 DATA backport

          Keep this draft until installed Apple Silicon acceptance passes. This workflow never publishes bottles or authorizes merge.
          EOF
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" \
              --title "chore(release): sync UNITARES $TAG" --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --draft --title "chore(release): sync UNITARES $TAG" --body-file "$body"
          fi
