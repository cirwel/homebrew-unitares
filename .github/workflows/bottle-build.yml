name: Build Apple Silicon bottles

# Building bottles consumes a billed Apple Silicon runner, so it is manual and
# protected. This job may write attestations, but cannot publish a release or
# change a formula branch.
on:
  workflow_dispatch:
    inputs:
      tap_ref:
        description: Tap commit to build (full Git commit)
        required: true
      bottle_tag:
        description: Future release tag used in bottle root URLs
        required: true

permissions:
  contents: read

concurrency:
  group: bottle-build-${{ inputs.tap_ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: >-
      github.repository == 'cirwel/homebrew-unitares' &&
      github.ref == 'refs/heads/main' &&
      vars.UNITARES_HOMEBREW_BOTTLES_ENABLED == 'true'
    environment: homebrew-bottle-build
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Verify protected environment arming secret
        env:
          ARMED: ${{ secrets.UNITARES_HOMEBREW_BOTTLES_ARMED }}
        run: test "$ARMED" = true

      - name: Check out the exact tap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tap_ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Build and test relocatable bottles
        env:
          TAP_REF: ${{ inputs.tap_ref }}
          BOTTLE_TAG: ${{ inputs.bottle_tag }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          [[ "$TAP_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TAP_REF"
          test "$GITHUB_SHA" = "$TAP_REF"
          [[ "$BOTTLE_TAG" =~ ^bottles-[A-Za-z0-9._-]+$ ]] || {
            echo "bottle_tag must match bottles-[A-Za-z0-9._-]+" >&2
            exit 1
          }
          brew update
          brew tap --custom-remote cirwel/unitares "file://$GITHUB_WORKSPACE"
          brew trust cirwel/unitares
          tap_repo="$(brew --repository cirwel/unitares)"
          for formula in apache-age unitares-pgvector unitares-lease-plane unitares; do
            brew install --build-bottle "cirwel/unitares/$formula"
            if [ "$formula" != unitares ]; then
              brew test "cirwel/unitares/$formula"
            fi
            brew bottle --json \
              --root-url="https://github.com/cirwel/homebrew-unitares/releases/download/$BOTTLE_TAG" \
              "cirwel/unitares/$formula"
          done
          brew bottle --merge --write --no-commit ./*.bottle.json
          mkdir "$RUNNER_TEMP/bottles"
          jq -s '[.[] | to_entries[] | .value.bottle.tags | to_entries[] | .value | {local_filename, filename}] | sort_by(.filename)' \
            ./*.bottle.json > "$RUNNER_TEMP/bottles/asset-map.json"
          jq -e 'length == 4 and ([.[].filename] | unique | length == 4) and ([.[].local_filename] | unique | length == 4)' \
            "$RUNNER_TEMP/bottles/asset-map.json"
          mv ./*.bottle.tar.gz ./*.bottle.json "$RUNNER_TEMP/bottles/"
          git -C "$tap_repo" diff --binary -- Formula \
            > "$RUNNER_TEMP/bottles/formula-bottles.patch"
          test -s "$RUNNER_TEMP/bottles/formula-bottles.patch"
          jq -n --arg tap_ref "$TAP_REF" --arg bottle_tag "$BOTTLE_TAG" \
            --arg run_id "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema_version:1,tap_ref:$tap_ref,bottle_tag:$bottle_tag,build_run_id:$run_id,build_run_attempt:$attempt}' \
            > "$RUNNER_TEMP/bottles/build-metadata.json"
          cp SOURCES.json "$RUNNER_TEMP/bottles/"
          brew config > "$RUNNER_TEMP/bottles/brew-config.txt"
          brew info --json=v2 --installed > "$RUNNER_TEMP/bottles/brew-inventory.json"
          python3 scripts/bottle_provenance.py prepare "$RUNNER_TEMP/bottles" \
            --tap-commit "$TAP_REF" --bottle-tag "$BOTTLE_TAG" \
            --build-run-id "$GITHUB_RUN_ID" --build-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Attest bottles and their complete evidence manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/bottles/*

      - name: Upload the build artifact for independent verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: homebrew-bottles-${{ github.run_id }}
          path: ${{ runner.temp }}/bottles
          if-no-files-found: error
          retention-days: 14
